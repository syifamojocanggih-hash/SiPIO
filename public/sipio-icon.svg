<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0e3a53"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Subtle Outer Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Feeder Funnel / Hopper Top -->
  <path d="M166 110 H346 L306 180 H206 Z" fill="url(#accent)" opacity="0.95"/>
  <rect x="236" y="180" width="40" height="25" rx="4" fill="#38bdf8"/>

  <!-- Falling Feed Pellets -->
  <circle cx="256" cy="225" r="7" fill="#fbbf24"/>
  <circle cx="248" cy="245" r="6" fill="#f59e0b"/>
  <circle cx="264" cy="265" r="7" fill="#fbbf24"/>

  <!-- Water Ripple Lines -->
  <path d="M120 380 Q 256 340 392 380" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="6" stroke-linecap="round"/>
  <path d="M150 410 Q 256 375 362 410" fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="6" stroke-linecap="round"/>

  <!-- Modern Stylized Fish -->
  <path d="M180 320 C 230 270, 310 270, 350 320 C 310 370, 230 370, 180 320 Z" fill="url(#accent)" filter="url(#glow)"/>
  <!-- Fish Tail -->
  <polygon points="180,320 130,285 145,320 130,355" fill="#38bdf8"/>
  <!-- Fish Eye -->
  <circle cx="325" cy="315" r="5" fill="#0f172a"/>
  <!-- Fish Fin -->
  <path d="M260 320 Q 275 345 295 330 Z" fill="#0284c7" opacity="0.8"/>
</svg>
